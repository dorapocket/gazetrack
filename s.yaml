edition: 1.0.0
name: web-framework-app
# Access is the credential configuration required by this application:
# Credential configuration reference: https://www.serverless-devs.com/serverless-devs/command/config
# Credential resolution order: https://www.serverless-devs.com/serverless-devs/tool
access: "undefined"

vars: # Global variables
  region: "cn-beijing"
  functionName: "express"
  service:
    name: "gazetrack-backend"
    description: 'Serverless Devs Web Framework Service'
    
services:
  framework: # Business name/module name
    # If you only want to operate on the framework module, add framework on the command line, e.g.:
    # Build only framework: s framework build
    # If you run s build without framework, the tool will build all modules at the same level
    # as framework (such as next-function below), in sequence.
    component: fc # Component name. Serverless Devs is the console, components are the game cards.
    actions:       # Custom execution logic. See: https://www.serverless-devs.com/serverless-devs/yaml
      pre-deploy: # Run before deploy
        - run: npm install --production --registry=https://registry.npmmirror.com                   # Command to run
          path: ./code                                    # Working directory for the command
#        - component: fc build --use-docker               # Component command: [component: name command args]
#        - plugin: myplugin                               # Plugin to run
#          args:                                          # Plugin args
#            testKey: testValue
#      post-deploy: # Run after deploy
#        - component: fc versions publish # Command to run
    props: # Component props
      region: ${vars.region}         # Variable usage: https://www.serverless-devs.com/serverless-devs/yaml
      service: ${vars.service}
      function:
        name: ${vars.functionName}
        description: 'Serverless Devs Web Framework Function'
        codeUri: './code'
        runtime: custom
        timeout: 60
        caPort: 9000
        customRuntimeConfig:
          command:
            - ./bootstrap
      triggers:
        - name: httpTrigger
          type: http
          config:
            authType: anonymous
            methods:
              - POST
      customDomains:
        - domainName: auto
          protocol: HTTP
          routeConfigs:
            - path: '/upload'
#  next-function: # Second function example (for reference only)
#    # If you run s deploy in this project, it will deploy modules:
#    #   helloworld: service hello-world-service, function cpp-event-function
#    #   next-function: service hello-world-service, function next-function-example
#    # To deploy only this service/function: s <module-name> deploy (e.g. s next-function deploy)
#    # To deploy only this function: s <module-name> deploy function (e.g. s next-function deploy function)
